name: RED recording path tests

on:
  push:
    branches:
      - implement/recording-paths
    paths:
      - 'patches/0001-recording-paths.patch'
      - '.github/workflows/red-path-tests.yml'

permissions:
  contents: read
  issues: write

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Checkout current upstream and apply test-only patch
        run: |
          git clone --depth 1 https://github.com/biliup/biliup.git upstream
          git -C upstream apply --check ../patches/0001-recording-paths.patch
          git -C upstream apply ../patches/0001-recording-paths.patch

      - name: Verify new tests fail for the intended missing features
        id: red
        shell: bash
        run: |
          set +e
          cargo test --manifest-path upstream/Cargo.toml -p biliup-cli server::common::util::tests -- --nocapture > cli-red.log 2>&1
          cli_status=$?
          cargo test --manifest-path upstream/Cargo.toml -p biliup downloader::util::tests -- --nocapture > core-red.log 2>&1
          core_status=$?
          set -e

          cat cli-red.log
          cat core-red.log

          if [ "$cli_status" -eq 0 ]; then
            echo "biliup-cli test unexpectedly passed before implementation" >&2
            exit 1
          fi
          if [ "$core_status" -eq 0 ]; then
            echo "biliup downloader test unexpectedly passed before implementation" >&2
            exit 1
          fi
          grep -Eq 'logical_record_date_naive|unresolved import' cli-red.log
          grep -Eq 'format_filename_at|cannot find function' core-red.log

          echo "cli_status=$cli_status" >> "$GITHUB_OUTPUT"
          echo "core_status=$core_status" >> "$GITHUB_OUTPUT"

      - name: Publish RED evidence as a temporary issue
        uses: actions/github-script@v7
        env:
          CLI_STATUS: ${{ steps.red.outputs.cli_status }}
          CORE_STATUS: ${{ steps.red.outputs.core_status }}
        with:
          script: |
            const fs = require('fs');
            const title = '[tdd-red] Recording path tests fail before implementation';
            const cli = fs.readFileSync('cli-red.log', 'utf8').slice(-3500);
            const core = fs.readFileSync('core-red.log', 'utf8').slice(-3500);
            const body = [
              'Expected TDD RED state confirmed on current upstream.',
              '',
              `biliup-cli status: ${process.env.CLI_STATUS}`,
              `biliup downloader status: ${process.env.CORE_STATUS}`,
              '',
              '```text',
              cli,
              core,
              '```'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
