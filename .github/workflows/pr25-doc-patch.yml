### 生产回归

PR #21 / #22 原本为了保护网页手动投稿，把 timeout / 恢复逻辑加在共享 `build_studio()` / `submit_to_bilibili()` 上。自动直播结束投稿也调用这两个公共函数，因此实验性手动保护意外改变了此前工作的自动投稿链路。

PR #24 起：

```text
自动上传 -> 恢复当前官方 biliup 的 build_studio + submit_to_bilibili 语义
手动上传 -> 只在 /v1/uploads 后台任务外围增加防卡死 timeout
```

因此四条运行时构建链都不再执行：

```text
fix_submit_timeout.py
fix_submit_pipeline_recovery.py
```

自动上传不再有自定义 90 秒 submit timeout、封面恢复、远端稿件确认或自动重试，也仍然没有 App -> Web fallback。自动 submit 返回错误时仍必须阻断成功 postprocessor/rm。

网页手动上传保留：

```text
build_studio 最多 60 秒
最终 submit 最多 120 秒
```

手动链路不自动重试最终 submit，也不重传媒体。

