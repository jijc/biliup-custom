name: Apply PR25 maintenance doc patch

on:
  push:
    branches:
      - fix/safe-strftime-upload-templates

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/safe-strftime-upload-templates
          fetch-depth: 0

      - name: Patch maintenance doc
        run: python scripts/patch_custom_changes_pr25.py

      - name: Commit maintenance doc
        shell: bash
        run: |
          if git diff --quiet -- CUSTOM_CHANGES.md; then
            echo "No documentation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUSTOM_CHANGES.md
          git commit -m "docs: document PR24 and PR25 upload fixes [skip ci]"
          git push origin HEAD:fix/safe-strftime-upload-templates
