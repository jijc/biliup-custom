## 4.21 非法 strftime 投稿标题不得导致上传任务 panic

**PR #25（2026-08-28）**

修改器：

```text
scripts/fix_safe_strftime_templates.py
```

修改官方文件：

```text
crates/biliup-cli/src/server/common/util.rs
```

Marker：

```text
biliup-custom:safe-strftime-templates:v1
```

### 真实根因

2026-08-28 同时出现“手动上传 5P 全部 `Upload completed` 后没有最终投稿”和“自动上传也在媒体上传后无稿件”。完整生产日志显示多个投稿模板的标题被写成：

```text
[%Y年%m月%日]-[{streamer}录播]-[{title}]
```

这里 `%日` 是非法 Chrono strftime，占位符少了 `d`。正确的“日”是：

```text
%d日
```

自动和手动上传都会经过：

```text
build_studio()
-> Recorder::format_title()
```

官方 `Recorder` 对用户模板直接执行 `DateTime::format(...).to_string()`。Chrono 对非法格式项在渲染时会 panic，因此后台上传 task 会直接 unwind，而不是返回普通 `Err`。这解释了为什么：

```text
所有媒体 P 已 Upload completed
-> 开始构建B站稿件信息
-> 没有 build timeout 日志
-> 没有页面上传失败日志
-> 没有最终 submit
```

### 当前修复

所有 `Recorder` 的用户可控时间模板统一经过 `safe_local_format()`：

```text
合法 strftime -> 完全保持 Chrono 原行为
非法 strftime -> warning + lenient 渲染，非法片段按字面保留，不 panic
```

例如错误模板：

```text
[%Y年%m月%日]
```

不会再杀死上传任务，而会得到类似：

```text
[2026年08月%日]
```

并继续进入 B站最终投稿。用户仍应把模板主动改成 `%d日`，这样最终标题才会显示真实日期。

保护覆盖：

```text
Recorder::generate_filename
Recorder::format_filename
Recorder::format_title
Recorder::format
```

所以自动上传与网页手动上传共享同一底层防护，不再分别在两套投稿流程上打补丁。

### 非目标

本修复不修改：

```text
媒体上传协议
B站 submit API 选择
App -> Web fallback
自动 submit retry
自动 postprocessor/rm 语义
手动 60/120 秒 guard
```

### 回归测试

```text
tests/test_safe_strftime_templates_modifier.py
Rust: biliup_custom_safe_strftime_tests
```

Rust 回归必须同时验证：

```text
%日  -> 不 panic，非法片段按字面保留
%d日 -> 正常输出日期
```

### 修改器顺序

该 modifier 必须运行在现有路径/每日编号相关 `util.rs` 修改之后，并在手动上传 guard 之前；它必须兼容 `modify_upstream.py + fix_daily_seq_temp_filename.py` 最终形成的 Recorder 代码形态。

### 同步官方时重点检查

如果官方以后对用户 strftime 模板做原生 validate / lenient rendering / Result 化错误处理，应触发 `42 / native-review` 并人工决定删除本 modifier，禁止叠加两套格式化策略。

