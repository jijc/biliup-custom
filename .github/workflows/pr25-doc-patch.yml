name: Apply PR25 maintenance doc patch

on:
  push:
    branches:
      - fix/safe-strftime-upload-templates

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/safe-strftime-upload-templates
          fetch-depth: 0

      - name: Patch maintenance doc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CUSTOM_CHANGES.md')
          s = p.read_text(encoding='utf-8')
          anchor = '## 4.17 实时日志 WebSocket 心跳、降噪与自动重连\n\n**PR #21（2026-08-28）**\n\n修改器：'
          masked = '## 4.17 实时日志 WebSocket 心跳、降噪与自动重连\n\n**PR #21（2026-08-28）**\n\n修改器： '
          if anchor not in s:
              raise SystemExit('PR21 websocket section anchor not found')
          p.write_text(s.replace(anchor, masked, 1), encoding='utf-8')
          PY
          python scripts/patch_custom_changes_pr25.py
          python - <<'PY'
          from pathlib import Path
          p = Path('CUSTOM_CHANGES.md')
          s = p.read_text(encoding='utf-8')
          masked = '## 4.17 实时日志 WebSocket 心跳、降噪与自动重连\n\n**PR #21（2026-08-28）**\n\n修改器： '
          restored = '## 4.17 实时日志 WebSocket 心跳、降噪与自动重连\n\n**PR #21（2026-08-28）**\n\n修改器：'
          p.write_text(s.replace(masked, restored, 1), encoding='utf-8')
          PY

      - name: Commit maintenance doc
        shell: bash
        run: |
          if git diff --quiet -- CUSTOM_CHANGES.md; then
            echo "No documentation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUSTOM_CHANGES.md
          git commit -m "docs: document PR24 and PR25 upload fixes [skip ci]"
          git push origin HEAD:fix/safe-strftime-upload-templates
