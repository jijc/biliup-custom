name: Sync upstream and build image

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/sync-and-build.yml'

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: biliup-custom-sync
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/jijc/biliup-custom

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.sha }}
      short_sha: ${{ steps.upstream.outputs.short_sha }}
      should_build: ${{ steps.decision.outputs.should_build }}
      native_candidate: ${{ steps.native.outputs.native_candidate }}
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Checkout current upstream
        id: upstream
        run: |
          git clone --depth 1 https://github.com/biliup/biliup.git upstream
          sha=$(git -C upstream rev-parse HEAD)
          short_sha=$(git -C upstream rev-parse --short=12 HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "Upstream: $sha"

      - name: Detect possible native replacement
        id: native
        shell: bash
        run: |
          set +e
          python3 scripts/check_upstream_native.py upstream
          status=$?
          set -e

          case "$status" in
            0)
              echo "native_candidate=false" >> "$GITHUB_OUTPUT"
              ;;
            42)
              echo "native_candidate=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Capability probe failed with status $status" >&2
              exit "$status"
              ;;
          esac

      - name: Decide whether a build is needed
        id: decision
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          NATIVE_CANDIDATE: ${{ steps.native.outputs.native_candidate }}
        run: |
          last_sha=""
          if [ -f state/upstream-sha.txt ]; then
            last_sha=$(tr -d '[:space:]' < state/upstream-sha.txt)
          fi

          should_build=true
          if [ "$NATIVE_CANDIDATE" = "true" ]; then
            should_build=false
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$UPSTREAM_SHA" = "$last_sha" ]; then
            should_build=false
          fi

          echo "last_sha=$last_sha"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Cache Rust build
        if: ${{ steps.decision.outputs.should_build == 'true' }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream

      - name: Apply custom patcher and run focused tests
        if: ${{ steps.decision.outputs.should_build == 'true' }}
        run: |
          python3 patches/apply_recording_paths.py upstream
          mkdir -p upstream/out
          printf '<!doctype html><title>test</title>\n' > upstream/out/index.html

          rustfmt --edition 2024 \
            upstream/crates/biliup-cli/src/server/common/util.rs \
            upstream/crates/biliup/src/downloader/util.rs
          rustfmt --edition 2024 --check \
            upstream/crates/biliup-cli/src/server/common/util.rs \
            upstream/crates/biliup/src/downloader/util.rs

          cargo test --manifest-path upstream/Cargo.toml -p biliup downloader::util::tests -- --nocapture
          cargo test --manifest-path upstream/Cargo.toml -p biliup-cli server::common::util::tests -- --nocapture

  native-notice:
    needs: prepare
    if: ${{ needs.prepare.outputs.native_candidate == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Create or update upstream-native notice
        uses: actions/github-script@v7
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        with:
          script: |
            const title = '[upstream-native] Official biliup may now support recording paths';
            const body = [
              'Automatic publishing has been paused because the conservative capability probe found a change that may make the custom recording-path layer unnecessary.',
              '',
              `Upstream commit: \`${process.env.UPSTREAM_SHA}\``,
              '',
              'No custom `latest` image was overwritten. Review official output-directory/path-template and logical-day support once; if equivalent, migrate back to the official image instead of extending this patch.'
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_build == 'true' && needs.prepare.outputs.native_candidate != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Checkout exact upstream commit and apply custom patcher
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/biliup/biliup.git
          git -C upstream fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          python3 patches/apply_recording_paths.py upstream
          rustfmt --edition 2024 \
            upstream/crates/biliup-cli/src/server/common/util.rs \
            upstream/crates/biliup/src/downloader/util.rs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          install: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=publish-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          test -n "$digest"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Generate artifact name
        id: artifact
        shell: bash
        run: |
          safe='${{ matrix.platform }}'
          safe="${safe//\//-}"
          echo "name=digests-$safe" >> "$GITHUB_OUTPUT"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.should_build == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify traceable candidate manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
          refs=$(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
          candidate='${{ env.IMAGE_NAME }}:upstream-'"$SHORT_SHA"
          docker buildx imagetools create -t "$candidate" $refs
          inspect=$(docker buildx imagetools inspect "$candidate")
          printf '%s\n' "$inspect"
          grep -q 'linux/amd64' <<< "$inspect"
          grep -q 'linux/arm64' <<< "$inspect"

      - name: Promote verified candidate to latest
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          candidate='${{ env.IMAGE_NAME }}:upstream-'"$SHORT_SHA"
          docker buildx imagetools create -t '${{ env.IMAGE_NAME }}:latest' "$candidate"
          inspect=$(docker buildx imagetools inspect '${{ env.IMAGE_NAME }}:latest')
          printf '%s\n' "$inspect"
          grep -q 'linux/amd64' <<< "$inspect"
          grep -q 'linux/arm64' <<< "$inspect"

      - name: Record last successfully published upstream commit
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        run: |
          mkdir -p state
          printf '%s\n' "$UPSTREAM_SHA" > state/upstream-sha.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/upstream-sha.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: record published upstream commit [skip ci]'
          git push origin HEAD:main

      - name: Close stale sync-failure issue after recovery
        uses: actions/github-script@v7
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
        with:
          script: |
            const title = '[sync-failure] biliup-custom could not follow upstream';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            for (const issue of issues.filter(i => i.title === title)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body: `Recovered and published upstream ${process.env.UPSTREAM_SHA}.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed' });
            }

  failure-notice:
    needs: [prepare, build, merge]
    if: ${{ always() && needs.prepare.outputs.native_candidate != 'true' && (needs.prepare.result == 'failure' || needs.build.result == 'failure' || needs.merge.result == 'failure') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Create or update sync-failure issue
        uses: actions/github-script@v7
        env:
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[sync-failure] biliup-custom could not follow upstream';
            const body = [
              'The automatic upstream sync/build workflow failed. Patch/tests and both image builds must succeed before `latest` is published. If failure happened only during final bookkeeping, inspect the run to confirm whether a validated image was already published.',
              '',
              `Upstream commit: \`${process.env.UPSTREAM_SHA || 'unknown'}\``,
              `prepare: ${process.env.PREPARE_RESULT}`,
              `build: ${process.env.BUILD_RESULT}`,
              `merge/publish: ${process.env.MERGE_RESULT}`,
              '',
              `Actions run: ${process.env.RUN_URL}`
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
