name: Apply PR23 documentation patch

on:
  push:
    branches:
      - fix/cover-failure-blocks-submit

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/cover-failure-blocks-submit
          fetch-depth: 0

      - name: Patch stale PR22 cover wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CUSTOM_CHANGES.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '- 封面失败/超时清空 cover 并继续；',
                  '- 封面失败/超时由后续 PR #23 safety modifier 阻断最终投稿；',
                  'stale regression wording',
              ),
              (
                  '如果官方以后原生提供 cover upload 完整 timeout/降级、最终 submit 的幂等机制、上传完成后的稿件状态确认，或持久化的“只重试 submit、不重传媒体”能力，应先人工比较语义，再决定删除/缩减本 modifier，不能叠加两套重试机制。',
                  '如果官方以后原生提供 cover upload 完整 timeout/明确失败语义、最终 submit 的幂等机制、上传完成后的稿件状态确认，或持久化的“只重试 submit、不重传媒体”能力，应先人工比较语义，再决定删除/缩减本 modifier，不能叠加两套重试机制。',
                  'stale native-review wording',
              ),
          ]

          changed = False
          for old, new, label in replacements:
              count = text.count(old)
              if count == 1:
                  text = text.replace(old, new, 1)
                  changed = True
              elif count == 0 and new in text:
                  print(f'{label}: already updated')
              else:
                  raise SystemExit(f'{label}: unexpected matches old={count}, new={text.count(new)}')

          if changed:
              path.write_text(text, encoding='utf-8')
              print('stale cover wording corrected')
          else:
              print('no stale cover wording remains')
          PY

      - name: Commit documentation update
        shell: bash
        run: |
          if git diff --quiet -- CUSTOM_CHANGES.md; then
            echo "No documentation changes needed"
            exit 0
          fi
          git config user.name "Ji JinChi"
          git config user.email "3109952@qq.com"
          git add CUSTOM_CHANGES.md
          git commit -m "docs: remove stale cover fallback wording"
          git push origin HEAD:fix/cover-failure-blocks-submit
