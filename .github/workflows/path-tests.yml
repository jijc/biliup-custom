name: Recording path tests

on:
  push:
    branches:
      - implement/recording-paths
    paths:
      - 'patches/**'
      - '.github/workflows/path-tests.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/path-tests.yml'

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Checkout current upstream and apply patches
        run: |
          git clone --depth 1 https://github.com/biliup/biliup.git upstream
          for patch in patches/*.patch; do
            echo "Applying $patch"
            git -C upstream apply --check "../$patch"
            git -C upstream apply "../$patch"
          done
          mkdir -p upstream/out
          printf '<!doctype html><title>test</title>\n' > upstream/out/index.html

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream

      - name: Check Rust formatting
        run: cargo fmt --manifest-path upstream/Cargo.toml --all -- --check

      - name: Run core recording path tests
        run: cargo test --manifest-path upstream/Cargo.toml -p biliup downloader::util::tests -- --nocapture

      - name: Run server recording path tests
        run: cargo test --manifest-path upstream/Cargo.toml -p biliup-cli server::common::util::tests -- --nocapture

      - name: Publish temporary GREEN evidence
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[tdd-green] Recording path tests pass';
            const body = `GREEN confirmed for ${context.sha}: all recording-path patches applied, rustfmt passed, and both focused Rust test groups passed.`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }

      - name: Publish temporary GREEN failure evidence
        if: ${{ failure() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const title = '[tdd-green-failure] Recording path verification failed';
            const body = `GREEN verification failed for ${context.sha}. Inspect: ${process.env.RUN_URL}`;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
