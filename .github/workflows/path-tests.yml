name: Recording path tests

on:
  push:
    branches:
      - implement/recording-paths
    paths:
      - 'patches/**'
      - '.github/workflows/path-tests.yml'
      - '.github/workflows/sync-and-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'patches/**'
      - '.github/workflows/path-tests.yml'
      - '.github/workflows/sync-and-build.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout custom repo
        uses: actions/checkout@v4

      - name: Checkout current upstream and apply custom patcher
        run: |
          git clone --depth 1 https://github.com/biliup/biliup.git upstream
          python3 patches/apply_recording_paths.py upstream
          mkdir -p upstream/out
          printf '<!doctype html><title>test</title>\n' > upstream/out/index.html

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream

      - name: Format and check only custom-modified Rust files
        run: |
          rustfmt --edition 2024 \
            upstream/crates/biliup-cli/src/server/common/util.rs \
            upstream/crates/biliup/src/downloader/util.rs
          rustfmt --edition 2024 --check \
            upstream/crates/biliup-cli/src/server/common/util.rs \
            upstream/crates/biliup/src/downloader/util.rs

      - name: Run core recording path tests
        run: cargo test --manifest-path upstream/Cargo.toml -p biliup downloader::util::tests -- --nocapture

      - name: Run server recording path tests
        run: cargo test --manifest-path upstream/Cargo.toml -p biliup-cli server::common::util::tests -- --nocapture
