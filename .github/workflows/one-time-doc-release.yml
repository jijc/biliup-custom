name: One-time final CUSTOM_CHANGES update

on:
  push:
    branches:
      - release/final-20260828

permissions:
  contents: write

jobs:
  update-doc:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/final-20260828

      - name: Disambiguate duplicate marker occurrence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CUSTOM_CHANGES.md')
          text = path.read_text(encoding='utf-8')
          old = 'biliup-custom:recordings-upload-picker:v1\n```'
          new = 'biliup-custom:recordings-upload-picker:v1\nbiliup-custom:manual-upload-feedback:v1\n```'
          if text.count(old) != 2:
              raise SystemExit(f'expected 2 marker occurrences, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update maintenance document
        run: python scripts/update_custom_changes_release.py

      - name: Commit document and remove one-time helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUSTOM_CHANGES.md
          git rm scripts/update_custom_changes_release.py .github/workflows/one-time-doc-release.yml
          git commit -m "docs: record PR #18 and final manual upload safety"
          git push origin HEAD:release/final-20260828
