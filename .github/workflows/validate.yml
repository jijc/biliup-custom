name: Validate biliup-custom

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run modifier unit tests
        run: python -m unittest discover -s tests -v

  upstream-rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve current upstream master
        id: upstream
        shell: bash
        run: |
          SHA="$(git ls-remote https://github.com/biliup/biliup.git refs/heads/master | awk '{print $1}')"
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Modify official source and run focused Rust tests
        shell: bash
        run: bash scripts/apply-and-test.sh "${{ steps.upstream.outputs.sha }}" "$RUNNER_TEMP/biliup-custom"
