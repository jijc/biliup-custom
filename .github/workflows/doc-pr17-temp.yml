name: Update PR17 maintenance documentation

on:
  push:
    branches:
      - fix/clear-optional-streamer-fields
    paths:
      - .github/workflows/doc-pr17-temp.yml

permissions:
  contents: write

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clear-optional-streamer-fields
          fetch-depth: 0
      - name: Update CUSTOM_CHANGES.md
        shell: python
        run: |
          from pathlib import Path

          path = Path("CUSTOM_CHANGES.md")
          text = path.read_text(encoding="utf-8")

          section = r'''
## 4.14 可选主播字段“主动清空”语义修复

**PR #17（2026-08-28）**

这是 PR #16 partial update 数据安全保护的配套修复。

修改器：

```text
scripts/fix_override_streamer_fields.py
```

新增修改官方文件：

```text
app/ui/TemplateModal.tsx
```

Marker：

```text
biliup-custom:clearable-streamer-fields:v1
```

### 原问题

PR #16 为避免前端漏字段把数据库值误清空，把后端更新语义改为：

```text
JSON 没有这个 key -> 保留旧值
JSON 明确传 null   -> 主动清空
```

这层保护是正确且必须保留的，但官方 `TemplateModal` 在用户把“文件名模板（可选）”等输入框清空后，Semi Form 可能把值表现为 `undefined` / 空字符串，而不是明确的 `null`。

于是会出现：

```text
用户清空单主播 filename_prefix
-> 前端没有明确表达“清空”
-> 后端按 PATCH 安全语义保留旧值
-> 再打开录播管理，旧模板仍然存在
```

这个问题和弹幕录制无关。

### 当前修复

在 `TemplateModal` 提交前，对可主动清空的主播标量字段做统一规范化：

```text
filename_prefix
upload_streamers_id
format
time_range
```

当这些字段的表单值为：

```text
undefined
空字符串
只包含空白字符的字符串
```

前端会明确发送：

```json
null
```

因此现在必须同时满足两条规则：

```text
页面没有提交/不知道的字段 -> 后端保留旧值，防止误清空
用户在录播管理明确清空字段 -> 前端发送 null，允许真正清空
```

### 对全局文件名模板的意义

推荐继续只在“空间配置”维护统一的全局 `filename_prefix`：

```text
/recordings/{streamer}/{record_date}/{daily_seq}-[%Y年%m月%d日-%H时%M分%S秒][{title}]
```

单主播 `filename_prefix = null` 时，运行时继续使用官方继承逻辑：

```text
单主播 filename_prefix.or(全局 filename_prefix)
```

因此单主播字段清空后应当只继承全局值，而不是把全局值复制进单主播数据库字段。

### 测试

```text
tests/test_config_safety_customizations.py
  -> test_optional_streamer_fields_can_be_explicitly_cleared
```

### 维护不变量

以后官方如果重构表单或改为真正 PATCH DTO，仍必须保留：

```text
遗漏字段 != 清空字段
主动清空必须有显式语义（null 或官方等价机制）
```

---

'''
          anchor = "# 5. `filtering_threshold`：我们明确保持官方行为"
          if "## 4.14 可选主播字段“主动清空”语义修复" not in text:
              if anchor not in text:
                  raise SystemExit("section 5 anchor missing")
              text = text.replace(anchor, section + anchor, 1)

          marker_anchor = "biliup-custom:upload-template-bool-roundtrip:v1\n"
          marker_line = "biliup-custom:clearable-streamer-fields:v1\n"
          if marker_line not in text:
              if marker_anchor not in text:
                  raise SystemExit("marker anchor missing")
              text = text.replace(marker_anchor, marker_anchor + marker_line, 1)

          webui_anchor = "app/ui/OverrideModal.tsx\napp/lib/api-streamer.ts"
          webui_new = "app/ui/OverrideModal.tsx\napp/ui/TemplateModal.tsx\napp/lib/api-streamer.ts"
          if "app/ui/TemplateModal.tsx" not in text:
              if webui_anchor not in text:
                  raise SystemExit("WebUI file table anchor missing")
              text = text.replace(webui_anchor, webui_new, 1)

          test_old = "tests/test_config_safety_customizations.py\n  -> OverrideModal 字段、前端 schema、投稿模板 bool round-trip、无模板保文件"
          test_new = "tests/test_config_safety_customizations.py\n  -> OverrideModal 字段、前端 schema、投稿模板 bool round-trip、可选主播字段显式 null 清空、无模板保文件"
          if test_old in text:
              text = text.replace(test_old, test_new, 1)

          config_old = "漏传 JSON 字段必须保留原值\n显式 null 才允许清空"
          config_new = "漏传 JSON 字段必须保留原值\nUI 主动清空可选主播字段必须显式发送 null\n显式 null 才允许清空"
          if config_old in text:
              text = text.replace(config_old, config_new, 1)

          timeline_anchor = "PR #16 2026-08-27  投稿/文件名模板丢失修复 + partial update + 无模板保文件\n"
          timeline_line = "PR #17 2026-08-28  可选主播字段主动清空发送 null，恢复单主播继承全局配置\n"
          if timeline_line not in text:
              if timeline_anchor not in text:
                  raise SystemExit("PR timeline anchor missing")
              text = text.replace(timeline_anchor, timeline_anchor + timeline_line, 1)

          text = text.replace("最后更新：2026-08-27", "最后更新：2026-08-28")
          text = text.replace(
              "当前文档对应自定义分支：`fix/preserve-upload-template-and-local-files`（PR #16，合并后以 `main` 为准）。",
              "当前文档对应自定义分支：`fix/clear-optional-streamer-fields`（PR #17，合并后以 `main` 为准）。",
          )

          path.write_text(text, encoding="utf-8")
      - name: Commit documentation and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/doc-pr17-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUSTOM_CHANGES.md .github/workflows/doc-pr17-temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: document explicit streamer field clearing"
          git push origin HEAD:fix/clear-optional-streamer-fields
