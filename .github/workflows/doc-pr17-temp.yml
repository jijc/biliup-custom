name: Update PR17 maintenance documentation

on:
  push:
    branches:
      - fix/clear-optional-streamer-fields
    paths:
      - .github/workflows/doc-pr17-temp.yml

permissions:
  contents: write

jobs:
  update-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/clear-optional-streamer-fields
          fetch-depth: 0
      - name: Update maintenance document
        run: python scripts/_temp_update_pr17_doc.py
      - name: Commit document and remove temporary helpers
        run: |
          rm -f .github/workflows/doc-pr17-temp.yml scripts/_temp_update_pr17_doc.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUSTOM_CHANGES.md .github/workflows/doc-pr17-temp.yml scripts/_temp_update_pr17_doc.py
          git commit -m "docs: document explicit streamer field clearing"
          git push origin HEAD:fix/clear-optional-streamer-fields
