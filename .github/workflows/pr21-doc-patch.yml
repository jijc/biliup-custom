name: Apply PR21 documentation patch

on:
  push:
    branches:
      - fix/ws-log-heartbeat-reconnect

permissions:
  contents: write

jobs:
  patch-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ws-log-heartbeat-reconnect
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch maintenance document
        run: python scripts/patch_custom_changes_pr21.py
      - name: Commit document update
        shell: bash
        run: |
          if git diff --quiet -- CUSTOM_CHANGES.md; then
            echo "No documentation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CUSTOM_CHANGES.md
          git commit -m "docs: apply PR21 custom changes"
          git push origin HEAD:fix/ws-log-heartbeat-reconnect
